[package]
name = "nibbles"
version = "0.1.0"
edition = "2021"
authors = ["Arc Riley <arcriley@gmail.com>"]
license = "AGPL-3.0-or-later"
description = "Optimized math operations on arrays of 4-bit integers"
repository = "https://github.com/arcriley/nibbles"
homepage = "https://github.com/arcriley/nibbles"
documentation = "https://docs.rs/nibbles"
readme = "README.md"
keywords = ["u4", "int4", "nibble", "simd", "quantization"]
categories = ["data-structures", "hardware-support", "science"]

[lib]
name = "nibbles"
path = "src/lib.rs"
